server = "omarchy.example.lan"
user = "your-user"
ssh_key = "C:\\Users\\YOUR_USER\\.ssh\\key-tunnel"
known_hosts = "C:\\Users\\YOUR_USER\\.ssh\\known_hosts"
toggle_hotkey = "Ctrl+Alt+Pause"
emergency_hotkey = "Ctrl+Shift+Alt+Pause"
server_alive_interval_seconds = 15
server_alive_count_max = 3
notify_on_toggle = true
remote_command = "remote-input-receiver"
